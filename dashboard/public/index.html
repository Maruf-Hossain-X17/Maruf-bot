<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARUF-BOT // CONTROL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.125);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        
        body {
            background: radial-gradient(circle at top left, #0f172a, #050b14, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 3D Glass Container */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* 3D Grid Grid System */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* 3D Card Hover Effects */
        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .card:hover {
            transform: translateY(-8px) rotateX(4deg) rotateY(4deg);
            border-color: var(--neon-blue);
            box-shadow: 0 15px 30px rgba(0, 243, 255, 0.2);
        }

        .card-icon {
            font-size: 1.8rem;
            color: var(--neon-blue);
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 5px;
            color: #fff;
        }

        /* External Hub Button */
        .hub-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00f3ff, #ff0055);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
        }

        .hub-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1><i class="fa-solid fa-robot"></i> MARUF-BOT</h1>
            <div id="bot-status" style="font-family: 'Orbitron'; color: #4ade80;">CONNECTING...</div>
        </div>

        <div class="stats-grid">
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-users"></i></div>
                <div class="card-title">Active Groups</div>
                <div class="card-value" id="groups">--</div>
            </div>
            
            <div class="card">
                <div class="card-icon" style="color: var(--neon-pink);"><i class="fa-solid fa-terminal"></i></div>
                <div class="card-title">Total Commands</div>
                <div class="card-value" id="commands">--</div>
            </div>

            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-microchip"></i></div>
                <div class="card-title">RAM Usage</div>
                <div class="card-value" id="memory">--</div>
            </div>

            <div class="card">
                <div class="card-icon" style="color: var(--neon-pink);"><i class="fa-solid fa-stopwatch"></i></div>
                <div class="card-title">Uptime</div>
                <div class="card-value" id="uptime">--</div>
            </div>
        </div>

        <!-- Web Link Integration -->
        <a href="https://web.maruf-x-hub.page.gd" target="_blank" class="hub-btn">
            <i class="fa-solid fa-globe"></i> VISIT MARUF-X-HUB PORTAL
        </a>
    </div>

    <script>
        function formatUptime(seconds) {
            const d = Math.floor(seconds / (3600*24));
            const h = Math.floor(seconds % (3600*24) / 3600);
            const m = Math.floor(seconds % 3600 / 60);
            const s = Math.floor(seconds % 60);
            return `${h}h ${m}m ${s}s`;
        }

        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('bot-status').innerText = data.status;
                document.getElementById('groups').innerText = data.groups;
                document.getElementById('commands').innerText = data.commands;
                document.getElementById('memory').innerText = data.memory;
                document.getElementById('uptime').innerText = formatUptime(data.uptime);
            } catch (err) {
                document.getElementById('bot-status').innerText = 'OFFLINE 🔴';
                document.getElementById('bot-status').style.color = '#ff0055';
            }
        }

        setInterval(updateStats, 3000);
        updateStats();
    </script>
</body>
</html>
